name: Build, Zip, and Release

on:
  release:
    branches: [ "master" ]
    types: [published]

jobs:
  build_and_release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install MSBuild
        run: |
          sudo apt-get update
          sudo apt-get install -y msbuild

      - name: Restore NuGet packages
        run: nuget restore .

      - name: Add Project Dependencies [#1]
        run: |
          mkdir ./bin
          cp ./DuckGame/lib/* ./bin

      - name: Build without AutoUpdater
        run: msbuild /m /p:Configuration=Release .

      - name: Build SDL3 for AppImage
        uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          install-linux-dependencies: true   # installs the X11/Wayland/audio dev packages
          version: 3-latest
        
      - name: Create AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 zsync
          export SDL_PREFIX="${{ steps.sdl.outputs.prefix }}"
          bash ./.github/workflows/create-appimage.sh

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./DuckGameRebuilt.AppImage*
          file_glob: true
          overwrite: true
